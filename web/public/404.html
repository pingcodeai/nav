e type="fractalNoise" baseFrequency=".8" numOctaves="1" stitchTiles="stitch" data-v-825268bd=""></feTurbulence><feColorMatrix type="saturate" values="0" data-v-825268bd=""></feColorMatrix><feComponentTransfer data-v-825268bd=""><feFuncR type="linear" slope="3" intercept="-1" data-v-825268bd=""></feFuncR><feFuncG type="linear" slope="3" intercept="-1" data-v-825268bd=""></feFuncG><feFuncB type="linear" slope="3" intercept="-1" data-v-825268bd=""></feFuncB></feComponentTransfer></filter></defs><filter id="error-page-grain" data-v-825268bd=""><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" data-v-825268bd=""></feTurbulence><feColorMatrix type="saturate" values="0" data-v-825268bd=""></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#error-page-grain)" data-v-825268bd=""></rect></svg><main id="error-content" class="error-page__content" tabindex="-1" data-v-825268bd=""><h1 class="error-page__title" data-v-825268bd=""><span class="error-page__sr-only" data-v-825268bd="">404: </span>Page not found</h1><a class="error-page__button" href="/" aria-label="Back home" data-v-825268bd=""><span class="error-page__button-text" aria-hidden="true" data-v-825268bd="">BACK HOME</span><span class="error-page__button-icon" aria-hidden="true" data-v-825268bd=""><svg class="error-page__arrow" viewBox="0 0 14 14" fill="currentColor" data-v-825268bd=""><path d="M6 0h2v2H6zm2 2h2v2H8zm2 2h2v2h-2zM0 6h14v2H0zm10 2h2v2h-2zm-2 2h2v2H8zm-2 2h2v2H6z" data-v-825268bd=""></path></svg><svg class="error-page__arrow error-page__arrow--next" viewBox="0 0 24 12" fill="currentColor" data-v-825268bd=""><path d="M0 0h2v2H0zm2 2h2v2H2zm2 2h2v4H4zM2 8h2v2H2zm-2 2h2v2H0zM9 0h2v2H9zm2 2h2v2h-2zm2 2h2v4h-2zm-2 4h2v2h-2zm-2 2h2v2H9zM18 0h2v2h-2zm2 2h2v2h-2zm2 2h2v4h-2zm-2 4h2v2h-2zm-2 2h2v2h-2z" data-v-825268bd=""></path></svg></span></a></main></div><script>(() => {
  const page = document.querySelector(".error-page");
  const digits = page.querySelector(".error-page__digits");
  const pixels = [...digits.querySelectorAll(".error-page__pixel")];
  const button = page.querySelector(".error-page__button");
  const label = button.querySelector(".error-page__button-text");
  const TEXT = "BACK HOME";
  const cfg = { idleDelay: 1000, touchInterval: 750, scrambleDuration: 800, scrambleInterval: 50 };
  const coords = pixels.map(el => ({
    x: Number(el.style.gridColumn.split("/")[0]) - 1,
    y: Number(el.style.gridRow.split("/")[0]) - 1
  }));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const hoverNone = matchMedia("(hover: none)");
  let visible = !document.hidden;
  let inView = true;
  let rect;
  let pitch = 61;
  let raf = 0;
  let idleTimer;
  let touchTimer;
  let scrambleTimer;
  let pointer = { x: 0, y: 0 };

  const active = () => !reduced.matches && visible && inView;
  const setIdle = idle => page.classList.toggle("error-page--idle", idle);
  const paint = values =>
    pixels.forEach((el, i) => {
      const v = values[i] ?? 0;
      el.style.setProperty("--pixel-intensity", String(v));
      el.classList.toggle("error-page__pixel--lit", v > 0);
    });
  const reset = () => {
    setIdle(true);
    paint(coords.map(() => 0));
  };
  const stopScramble = () => {
    clearInterval(scrambleTimer);
    scrambleTimer = undefined;
    label.textContent = TEXT;
  };
  const stopAll = () => {
    cancelAnimationFrame(raf);
    raf = 0;
    clearTimeout(idleTimer);
    clearInterval(touchTimer);
    touchTimer = undefined;
    stopScramble();
    reset();
  };
  const measure = () => {
    rect = digits.getBoundingClientRect();
    pitch = (rect.width + 1) / 12;
  };
  const falloff = (x, y, cx, cy) => [1, 0.36, 0.16][Math.max(Math.abs(x - cx), Math.abs(y - cy))] ?? 0;
  const frame = () => {
    raf = 0;
    if (!active() || !rect) return;
    const cx = Math.floor((pointer.x - rect.left) / pitch);
    const cy = Math.floor((pointer.y - rect.top) / pitch);
    paint(coords.map(p => falloff(p.x, p.y, cx, cy)));
  };
  const sync = () => {
    page.classList.toggle("error-page--paused", !active());
    stopAll();
    if (!active() || !hoverNone.matches) return;
    touchTimer = setInterval(() => {
      setIdle(false);
      paint(coords.map(() => (Math.random() > 0.55 ? Math.random() * 0.65 : 0)));
    }, cfg.touchInterval);
  };

  page.addEventListener("pointermove", event => {
    if (!active() || hoverNone.matches || event.pointerType === "touch") return;
    setIdle(false);
    pointer = { x: event.clientX, y: event.clientY };
    if (!raf) raf = requestAnimationFrame(frame);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(reset, cfg.idleDelay);
  });

  const scramble = () => {
    if (!active() || scrambleTimer) return;
    const start = performance.now();
    const pool = TEXT.replace(/\s/g, "");
    scrambleTimer = setInterval(() => {
      const progress = (performance.now() - start) / cfg.scrambleDuration;
      if (progress >= 1) return stopScramble();
      label.textContent = [...TEXT]
        .map((ch, i) => (ch === " " || i < progress * TEXT.length ? ch : pool[Math.floor(Math.random() * pool.length)]))
        .join("");
    }, cfg.scrambleInterval);
  };
  button.addEventListener("pointerenter", scramble);
  button.addEventListener("focus", scramble);

  document.addEventListener("visibilitychange", () => {
    visible = !document.hidden;
    sync();
  });
  reduced.addEventListener("change", sync);
  hoverNone.addEventListener("change", sync);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      inView = entry?.isIntersecting ?? false;
      sync();
    }).observe(page);
  }
  if ("ResizeObserver" in window) new ResizeObserver(measure).observe(page);
  addEventListener("scroll", measure, { passive: true });
  addEventListener("resize", measure, { passive: true });
  measure();
  sync();
})();
</script>
