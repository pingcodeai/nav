<svg width="403" height="100" viewBox="0 0 403 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">PingCode.ai 加载动画</title>
<desc id="desc">橙色速度线在标志左侧依次向右律动。</desc>
<style>
  .speed-line {
    transform-box: fill-box;
    transform-origin: center;
    animation: forward 1.4s cubic-bezier(.45, 0, .2, 1) infinite;
  }
  .speed-line.top { animation-delay: -.42s; }
  .speed-line.middle { animation-delay: -.21s; }
  .speed-line.bottom { animation-delay: 0s; }
  @keyframes forward {
    0%, 100% { opacity: .42; transform: translateX(-4px) scaleX(.88); }
    28% { opacity: 1; transform: translateX(0) scaleX(1); }
    51% { opacity: 1; transform: translateX(5px) scaleX(1.07); }
    76% { opacity: .55; transform: translateX(1px) scaleX(.97); }
  }
  @media (prefers-reduced-motion: reduce) {
    .speed-line { animation: none; opacity: 1; transform: none; }
  }
</style>
